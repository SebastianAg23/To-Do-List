<section>
  <ul class="list-group">
    @for (Task of _task.TaskList(); track Task.id; let idx = $index) {
      <li class="list-group-item list-group-item-action list-group-item-light d-flex justify-content-between align-items-center">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" [checked]="Task.status" #checkInput (change)="checkTask(Task.id, checkInput.checked)">
          <label class="form-check-label ps-5" [class.text-decoration-line-through]="Task.status" for="checkDefault">{{ Task.title }}</label>
        </div>
        <a type="button" class="text-black-50 text-decoration-none">
          <i class="fa-solid fa-trash" (click)="deleteTask(Task.id)"></i>
        </a>
      </li>
    } @empty { 
      <li class="list-group-item text-center">Sin Tareas</li>
    }
  </ul>
</section>
